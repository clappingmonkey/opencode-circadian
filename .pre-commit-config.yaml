# Run locally with prek (`prek install`, `prek run --all-files`); CI runs the
# same hooks in the "pre-commit checks" job. Revs are frozen to commit SHAs.
exclude: ^(CHANGELOG\.md|package-lock\.json)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files

  - repo: https://github.com/biomejs/pre-commit
    rev: f9fccc969fb42a59a17a1a430df9f38851f9b2da # frozen: v2.6.3
    hooks:
      - id: biome-check

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # `concurrency.queue` is valid on GitHub but unknown to actionlint 1.7.12
        # (rhysd/actionlint#657).
        args: [-ignore, 'unexpected key "queue"']

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
