name: CI # renovate-approve.yaml triggers on this name

# No `push` trigger: pushes to main are already tested by release.yaml, which
# calls this workflow via `workflow_call` before release-please runs. Keeping a
# second `push` trigger here would run the same jobs twice on every merge.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as the other jobs for the biome hook (language: node).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Installed directly so the binary is checksum-verified (prek-action
      # v3.0.0 has no checksum for 0.5.3 and skips verification).
      - name: Install prek
        env:
          PREK_VERSION: 0.5.3
          PREK_SHA256: c1475ddc56df0003c780557d9b52273d9eb19c9ef8d91143f3ce03511182a36e
        run: |
          asset=prek-x86_64-unknown-linux-gnu
          curl -fsSLo "$RUNNER_TEMP/prek.tar.gz" \
            "https://github.com/j178/prek/releases/download/v$PREK_VERSION/$asset.tar.gz"
          echo "$PREK_SHA256  $RUNNER_TEMP/prek.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/prek.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset" >> "$GITHUB_PATH"

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure --skip zizmor

      # Only zizmor gets a token (for its online audits; read-only).
      - name: Run zizmor
        run: prek run --all-files zizmor
        env:
          GH_TOKEN: ${{ github.token }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
