name: CI # renovate-approve.yaml triggers on this name

# No `push` trigger: pushes to main are already tested by release.yaml, which
# calls this workflow via `workflow_call` before release-please runs. Keeping a
# second `push` trigger here would run the same jobs twice on every merge.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as the other jobs for the biome hook (language: node).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Installs prek from mise.toml; mise.lock pins its URL and checksum
      # (the action adds --locked). The mise binary itself is pinned here and
      # checked against mise's signed checksums.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          cache: false

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure --skip zizmor
        env:
          MISE_GITHUB_TOKEN: "" # set by mise-action; hooks don't need it

      # Only zizmor gets a token (for its online audits; read-only).
      - name: Run zizmor
        run: prek run --all-files zizmor
        env:
          GH_TOKEN: ${{ github.token }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
