name: Auto-approve Renovate PRs

# Approves a Renovate PR after CI passes on its current head commit.
# workflow_run (not a ci.yml step): runs from main, so a PR can't edit it to
# leak APPROVER_PAT. Never check out or run PR code here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['renovate/automerge-**']

permissions: {}

jobs:
  approve:
    # Bot actors block human pushes/re-runs; branch prefix comes from renovate.json.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'renovate/automerge-')
      && github.event.workflow_run.actor.login == 'opencode-circadian-renovate[bot]'
      && github.event.workflow_run.triggering_actor.login == 'opencode-circadian-renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    concurrency:
      group: renovate-approve-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Approve PR if it is still the tested commit
        # workflow_run.pull_requests is empty here, so look the PR up by branch.
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER_TOKEN: ${{ secrets.APPROVER_PAT }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          BOT: opencode-circadian-renovate[bot]
        run: |
          set -euo pipefail

          prs="$(gh api --method GET "repos/$REPO/pulls" \
            -f state=open -f head="$OWNER:$BRANCH" -f per_page=10)"
          count="$(jq 'length' <<<"$prs")"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one open PR for $BRANCH, found $count; skipping."
            exit 0
          fi
          pr="$(jq '.[0]' <<<"$prs")"
          number="$(jq -r '.number' <<<"$pr")"

          # Re-check the live PR.
          reason="$(jq -r --arg bot "$BOT" --arg sha "$TESTED_SHA" --arg repo "$REPO" '
            if .user.login != $bot then "author is \(.user.login), not \($bot)"
            elif .draft then "PR is a draft"
            elif .head.repo.full_name != $repo then "head repo is \(.head.repo.full_name)"
            elif .head.sha != $sha then "head moved to \(.head.sha); CI for that commit will decide"
            elif ([.labels[]?.name] | index("automerge")) == null then "no automerge label"
            elif ([.labels[]?.name] | index("major")) != null then "has major label"
            else "" end' <<<"$pr")"
          if [ -n "$reason" ]; then
            echo "Not approving #$number: $reason."
            exit 0
          fi

          approved="$(gh api --paginate "repos/$REPO/pulls/$number/reviews" \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$TESTED_SHA\")] | length" \
            | awk '{s += $1} END {print s + 0}')"
          if [ "$approved" -gt 0 ]; then
            echo "#$number already approved at $TESTED_SHA; nothing to do."
            exit 0
          fi

          # Pin the approval to the tested commit.
          GH_TOKEN="$APPROVER_TOKEN" gh api --method POST \
            "repos/$REPO/pulls/$number/reviews" \
            -f event=APPROVE \
            -f commit_id="$TESTED_SHA" \
            -f body="Auto-approved: non-major Renovate update, CI passed at $TESTED_SHA."
          echo "Approved #$number at $TESTED_SHA."
