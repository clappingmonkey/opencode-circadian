name: Auto-approve bot PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  approve:
    # Auto-approve non-major Renovate updates and release-please release PRs so
    # they can satisfy the "1 approval" branch ruleset for a solo maintainer.
    if: >-
      (github.actor == 'renovate-boto[bot]' && !contains(github.event.pull_request.labels.*.name, 'major'))
      || (github.actor == 'github-actions[bot]' && startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --repo ${{ github.repository }}
          gh pr comment ${{ github.event.pull_request.number }} --body "Auto-approved: automated bot PR. Will merge once all status checks pass." --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.APPROVER_PAT }}
