name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level (debug/trace for troubleshooting)
        type: choice
        options: [info, debug, trace, warn]
        default: info

# Renovate authenticates with the GitHub App token below; the default
# GITHUB_TOKEN is not used at all.
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # No checkout: Renovate clones the repository itself via the API token.
      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ steps.token.outputs.token }}
        env:
          # Forwarded to the Renovate container by the action's default
          # env-regex. Scheduled runs have no inputs, so they fall back to info.
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
