name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run CI only, skip release-please and publish
        type: boolean
        default: false

# Serialize releases: two merges in quick succession must not run
# release-please / npm publish concurrently. `queue: max` keeps every pending
# run (FIFO, up to 100) instead of only the newest, and is only valid with
# `cancel-in-progress: false` - an in-flight publish is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

# Least privilege: release-please uses a GitHub App token (see below) and the
# publish job declares its own permissions, so the default GITHUB_TOKEN only
# needs read access at the workflow level.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !inputs.dry-run }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # This job can mint an npm OIDC token (id-token: write), so it runs no
  # third-party code: no `npm ci`, no tests, no lifecycle scripts. That is
  # safe because the package ships raw `src/` with no build step and has no
  # runtime dependencies, and the `ci` job above has already typechecked and
  # tested this exact commit (`needs` chains ci -> release-please -> publish).
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    # Environment `npm` only allows deployments from `main`. The npm trusted
    # publisher's "Environment name" must be `npm` too (OIDC sub changes).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The "ci already tested this commit" argument above only holds if the
      # release was tagged on the commit this run was triggered for. If an
      # earlier run failed and release-please is catching up on a later push,
      # the tag points at an older commit than github.sha; stop instead of
      # publishing code that doesn't match the tag.
      - name: Check release commit matches the tested commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG_NAME was tagged at $RELEASE_SHA but this run tested $GITHUB_SHA. Publish manually from the tag after verifying it."
            exit 1
          fi
          echo "Publishing $TAG_NAME from $GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a dependency cache in the job that holds id-token:
          # a poisoned cache could run code with access to the OIDC token.
          package-manager-cache: false

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. The npm bundled with the
      # Node 24 LTS line already satisfies that, so use it as-is rather than
      # pinning an older global npm. Fail loudly if that ever stops being true.
      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(s=>parseInt(s,10));process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$NPM_VERSION" \
            || { echo "::error::npm $NPM_VERSION < 11.5.1; trusted publishing will fail"; exit 1; }

      # Provenance is generated automatically under trusted publishing.
      # --ignore-scripts: never run package lifecycle scripts while the OIDC
      # token is obtainable (there are none today; this keeps it that way).
      - name: Publish
        run: npm publish --access public --ignore-scripts
